name: Yieldify *
description: 'Yieldify is a website personalization and conversion rate optimization (CRO) platform
  for ecommerce brands, founded in 2013 in London by Jay Radia and backed by investors including GV
  (Google Ventures). Its SaaS platform delivers targeted on-site messaging, customer-journey
  personalization, and A/B testing to lift conversion and revenue. Yieldify was acquired by Publicis
  Groupe in January 2023 and folded into Epsilon, where it is now sold as Epsilon Accelerate;
  yieldify.com redirects to the Epsilon Accelerate product page and the legal entity behind the
  platform is Zeus Enterprise Ltd, trading as Yieldify. Delivery is entirely client-side: a
  customer-specific JavaScript tag placed before the closing head tag (directly, or via Google Tag
  Manager, Tealium, Shopify theme.liquid or Recharge checkout) renders a documented library of
  on-site experience components — overlays, notifications, banners, sticky and embedded experiences,
  toasters, carousels, countdown timers, lead-capture forms — configured from the Yieldify Conversion
  Platform at convert.yieldify.com, with a typed dynamic-expression language for personalized copy
  and client-side yieldify_impression/click/close/form_submit events pushed into the customer''s own
  GA4 property. There is no public developer API: probing every Yieldify host on 2026-08-13 found no
  OpenAPI, GraphQL, MCP, A2A card, webhooks, SDK, CLI or developer portal, the status page at
  status.yieldify.com has been deactivated, and no pricing is published anywhere.'
