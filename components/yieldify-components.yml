dynamic_content:
  source: https://support.yieldify.com/en/articles/11478574-dynamic-content
  options: [Dynamic variable, Dynamic promotion, Dynamic page views, Dynamic expressions]
  expression_language:
    source: https://support.yieldify.com/en/articles/11420343-custom-dynamic-expressions
    description: >-
      A small typed expression DSL for personalizing component copy. Variables must already exist
      in the site's site-mapping configuration and must be declared with their type.
    accessor: var<string>("name") / var<number>("name")
    concatenation: '++'
    conditionals: if <expr> then <expr> else <expr>; if / else if / else supported
    published_examples:
    - 'var<number>("product.price")'
    - '"You have £" ++ var<number>("basket.value") ++ " worth of items in your basket. "'
    - 'if var<number>("basket.value") < 20 then "Only £" ++ 20 - var<number>("basket.value") ++ " away from Free shipping" else "You have qualified for Free shipping"'
tooling:
- name: Preview App
  kind: client-side QA tool
  activation: append '#yipreview' to any URL on the customer site and reload
  capabilities: [Preview mode (honors real targeting/triggering rules), Audiences View]
  source: https://support.yieldify.com/en/articles/5170209-preview-app
analytics_events:
  note: >-
    Client-side analytics events the tag pushes into the customer's own analytics stack. This is
    NOT a webhook or server-side event API — there is no subscription endpoint and no delivery
    contract — so no AsyncAPI or Webhooks pointer is emitted for it.
  ga4:
    source: https://support.yieldify.com/en/articles/8005968-ga4-yieldify-integrated-events
    events:
    - name: yieldify_impression
      parameters: [yieldify_campaign_name, yieldify_campaign_variant, yieldify_campaign_stage, yieldify_campaign_id]
    - name: yieldify_click
      parameters: [yieldify_element_id, yieldify_campaign_name, yieldify_campaign_variant, yieldify_campaign_stage, yieldify_campaign_action, yieldify_campaign_id]
    - name: yieldify_close
      parameters: [yieldify_campaign_name, yieldify_campaign_variant, yieldify_campaign_stage, yieldify_campaign_id]
    - name: yieldify_form_submit
      parameters: [yieldify_element_id, yieldify_campaign_name, yieldify_campaign_variant, yieldify_campaign_stage, yieldify_campaign_id]
  universal_analytics:
    source: https://support.yieldify.com/en/articles/5230838-google-analytics-integration
    envelope:
      category: Yieldify
      action: '<campaign name> - <variant> - <format/stage>'
      label: Impression | Click | Close | Submit (+ element ID appended where >1 CTA)
    tracker_modes: [send to all trackers (default), send to specific trackers]
    opt_out: Disabled per site in platform Settings.
destination_integrations:
  note: >-
    Outbound connectors configured in the platform (Yieldify consuming third-party APIs on the
    customer's behalf) — recorded for completeness; none of these is an API Yieldify exposes.
  connectors:
  - name: Mailchimp
    auth: OAuth authorization from the platform Settings page; customer supplies an Audience ID.
    source: https://support.yieldify.com/en/articles/5230839-mailchimp-integration
  - name: Campaign Monitor
    source: https://support.yieldify.com/en/articles/5230841-campaign-monitor-integration
  - name: Google Analytics / GA4
    source: https://support.yieldify.com/en/articles/8032915-ga4-integration-via-google-tag-manager
