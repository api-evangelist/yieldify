generated: '2026-08-13'
method: searched
source: https://support.yieldify.com/en/collections/2887594-campaign-formats-and-components
docs: https://support.yieldify.com/en/
note: >-
  Yieldify (now Epsilon Accelerate) ships NO server-side SDK and NO public REST API — its entire
  developer-visible surface is client-side. A single JavaScript tag is placed on the customer's
  site and renders a documented library of on-site experience components, configured from the
  Yieldify Conversion Platform (YCP). This artifact captures that published component surface,
  the loader, the CSP hosts a customer must allowlist, the dynamic-expression language the
  components accept, and the client-side analytics events the tag emits. Everything here is read
  verbatim from the public Epsilon Accelerate Help Center for Yieldify; nothing is inferred.
loader:
  kind: javascript-tag
  placement: immediately before </head>, on every page of the customer site
  distribution: >-
    Customer-specific snippet copied from the Settings page of the Yieldify Conversion Platform;
    no public CDN URL, no npm package, no version string is published.
  install_methods:
  - method: google-tag-manager
    detail: Custom HTML tag, trigger All Pages / Page View
    source: https://support.yieldify.com/en/articles/5129907-google-tag-manager-integration
  - method: tealium-tag-manager
    source: https://support.yieldify.com/en/articles/5130005-tealium-tag-manager-integration
  - method: manual
    detail: Paste before </head> on every page; the docs explicitly recommend a tag manager instead.
    source: https://support.yieldify.com/en/articles/5130901-manual-tag-integration
  - method: shopify
    detail: theme.liquid <head>; Shopify Plus customers additionally edit checkout.liquid
    source: https://support.yieldify.com/en/articles/5130928-shopify-integration
  - method: recharge-checkout
    source: https://support.yieldify.com/en/articles/5802251-recharge-checkout-integration
  rendering_note: >-
    The tag inserts an iframe to limit the amount of code executing in the host page context,
    which is why child-src / frame-src must allow *.yieldify.com and 'about:blank'.
content_security_policy:
  source: https://support.yieldify.com/en/articles/6295536-tag-implementation-content-security-policy-csp
  guidance: >-
    Extend existing directives only — the docs explicitly warn against creating new directives
    solely for Yieldify.
  directives:
  - directive: default-src
    hosts: ['https://*.yieldify.com', 'https://*.yieldify-production.com']
  - directive: child-src
    hosts: ['https://*.yieldify.com', "'about:blank'"]
  - directive: frame-src
    hosts: ['https://*.yieldify.com', "'about:blank'"]
  - directive: script-src
    hosts: ['https://*.yieldify.com', "'unsafe-inline'"]
  - directive: connect-src
    hosts: ['https://*.yieldify.com', '*.yieldify-production.com', 'https://yieldify.connectorengine.com']
  - directive: img-src
    hosts: ['https://*.yieldify.com', 'https://*.yieldify-production.com']
  - directive: font-src
    hosts: ['https://*.yieldify-production.com', 'fonts.gstatic.com']
    note: Custom platform fonts are served from https://fonts.yieldify-production.com/
  - directive: worker-src
    hosts: ['blob:']
