note: >-
  Yieldify (Epsilon Accelerate) publishes no API, so every API-shaped standard below is recorded
  as not-applicable rather than failed. What it DOES publish is a data-protection posture — a
  Platform Policy, a dated Data Collection Policy, a Cookie Policy, and a self-service data
  subject access/erasure workflow inside the customer platform. Those are captured with evidence.
  No named security certification (SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP) is published on any
  Yieldify host, so NO `Compliance` pointer is emitted in apis.yml — per the pipeline rule that
  Compliance is only awarded for a published compliance program, not for asserted conformance.
