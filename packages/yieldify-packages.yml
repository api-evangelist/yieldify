  first-party client libraries in any package registry, and ships no public API for one to wrap.
  The product is delivered exclusively as a customer-specific JavaScript tag copied from the
  Settings page of the Yieldify Conversion Platform and pasted into the site <head> (directly, via
  Google Tag Manager / Tealium, or into a Shopify theme.liquid). That tag has no registry entry and
  no publicly pinned CDN URL — the snippet itself is only visible to an authenticated customer —
  so there is no version or publish date to read, and none is guessed here. No Packages or SDKs
  pointer is emitted in apis.yml, because emitting one would assert an SDK surface the provider
  does not have.
