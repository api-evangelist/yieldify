product_lifecycle:
- date: '2013'
  event: Yieldify founded in London by Jay Radia; backed by GV (Google Ventures).
- date: '2023-01'
  event: Acquired by Publicis Groupe and folded into Epsilon.
- date: '2026'
  event: >-
    Product marketed as Epsilon Accelerate. The help center is titled "Epsilon Accelerate Help
    Center for Yieldify" and the Data Collection Policy is headed "Epsilon Accelerate (formerly
    Yieldify)". The customer application still runs under the Yieldify Conversion Platform (YCP)
    name at convert.yieldify.com.
- date: '2026'
  event: >-
    Upgrade path published from the Yieldify tag to the "Epsilon tag", which adds COREid
    capabilities (real-time attribute recognition, lookalike audiences, full-circle retargeting,
    demographics reporting).
  source: https://support.yieldify.com/en/articles/13016967-epsilon-tag-features
